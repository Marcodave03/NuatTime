<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuat Time</title>
<meta name="description" content="Thai reflexology in Golf Island, Pantai Indah Kapuk. Open every day, 09:00 to 21:00.">
<meta name="theme-color" content="#F3EFEC">
<link rel="icon" type="image/png" href="./assets/NuatTime.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@1,9..144,300..500,0..100,0..1&display=swap">

<link rel="prefetch" href="./main.html" as="document">
<link rel="prefetch" href="./style.css" as="style">
<link rel="prefetch" href="./assets/opt/inside.webp" as="image">

<script>
  (function () {
    try {
      var saved = localStorage.getItem('nuat-theme');
      var prefersDusk = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDusk ? 'dusk' : 'day'));
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'day');
    }
  })();
</script>

<style>
  :root { --ground: #F3EFEC; --ink: #8A7061; --meta: #2A1B12; }
  :root[data-theme="dusk"] { --ground: #2A1B12; --ink: #A8968A; --meta: #F3EFEC; }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: var(--ground);
    color: var(--ink);
    overflow: hidden;
    transition: background-color .5s ease;
  }

  .splash { text-align: center; padding: 2rem; }

  .splash__mark {
    width: min(420px, 68vw);
    height: auto;
    margin-inline: auto;
    opacity: 0;
    transform: translateY(14px);
    animation: rise 1.1s cubic-bezier(.22, 1, .36, 1) forwards;
  }

  .splash__line {
    margin: 1.75rem 0 0;
    font-family: 'Fraunces', Georgia, serif;
    font-variation-settings: "opsz" 18, "SOFT" 70, "WONK" 1;
    font-style: italic;
    font-size: clamp(1rem, .9rem + .5vw, 1.2rem);
    letter-spacing: -.01em;
    opacity: 0;
    animation: rise 1.1s cubic-bezier(.22, 1, .36, 1) .3s forwards;
  }

  /* A slow filling rule stands in for a spinner - it reads as breath, not load */
  .splash__rule {
    width: min(220px, 44vw);
    height: 1px;
    margin: 2.25rem auto 0;
    background: color-mix(in srgb, var(--ink) 28%, transparent);
    position: relative;
    overflow: hidden;
  }
  .splash__rule::after {
    content: '';
    position: absolute; inset: 0;
    background: var(--meta);
    transform-origin: left;
    transform: scaleX(0);
    animation: fill 1.5s cubic-bezier(.65, .05, .36, 1) .25s forwards;
  }

  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  @keyframes fill { to { transform: scaleX(1); } }

  @media (prefers-reduced-motion: reduce) {
    .splash__mark, .splash__line { opacity: 1; transform: none; animation: none; }
    .splash__rule::after { animation: none; transform: scaleX(1); }
  }
</style>
</head>

<body>
  <main class="splash">
    <img class="splash__mark" src="./assets/Nuatlogo.svg" alt="Nuat Time" width="655" height="186" fetchpriority="high">
    <p class="splash__line">Thai reflexology, Pantai Indah Kapuk</p>
    <div class="splash__rule" aria-hidden="true"></div>
    <noscript><p><a href="./main.html">Enter</a></p></noscript>
  </main>

<script>
  (function () {
    var went = false;
    function enter() {
      if (went) return;
      went = true;
      window.location.replace('./main.html');
    }
    /* Leave once the mark has had time to land; never hang on a slow network */
    window.addEventListener('load', function () { setTimeout(enter, 900); });
    setTimeout(enter, 2600);
  })();
</script>
</body>
</html>
